name: 同步每日论文MD报告
on:
  schedule:
    # UTC 0点 = 北京时间上午8点自动抓取
    - cron: '5 14 * * *'
  workflow_dispatch: # 可手动点按钮测试运行

jobs:
  sync_md:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取你仓库代码
        uses: actions/checkout@v5

      - name: 计算日期并下载远程MD
        run: |
          # 取昨天的日期（朋友每天生成前一天的报告）
          YESTERDAY=$(date -d "yesterday" +%Y-%m-%d)
          MONTH=$(date -d "yesterday" +%Y-%m)
          MD_FILE="Arxiv_Report_${YESTERDAY}.md"
          REMOTE_PATH="reports/${MONTH}/${MD_FILE}"
          SRC_URL="https://cdn.jsdelivr.net/gh/Sprout-Lee/daily-paper-reading@main/${REMOTE_PATH}"

          mkdir -p ./paper-audio
          LOCAL_MD=./paper-audio/today.md

          wget --timeout=15 -O ${LOCAL_MD} "${SRC_URL}" || echo "昨日文档尚未生成，跳过"
          
      - name: 提交更新
        run: |
          git config --global user.name "wangmou21"
          git config --global user.email "wangmou21@mail.nwpu.edu.cn"
          git add paper-audio/
          git commit -m "同步论文日报 ${TODAY}" || echo "无新内容无需提交"
          git push
